name: NARAVA Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --version
      - run: node scripts/validate/repository-contract.mjs
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
